name: Bygg kartdata

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 2 * *" # den 2:a varje månad
  push:
    paths:
      - "scripts/build_tiles.py"
      - ".github/workflows/build-tiles.yml"

permissions:
  contents: write

concurrency:
  group: build-tiles
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera kartbibliotek
        run: pip install osmium

      - name: Ladda ner Sverigekartan
        run: curl -fsSL --retry 3 -o sweden.osm.pbf https://download.geofabrik.de/europe/sweden-latest.osm.pbf

      - name: Bygg rutor med hastighetsgränser
        run: python scripts/build_tiles.py sweden.osm.pbf docs/tiles

      - name: Spara kartdata
        run: |
          du -sh docs/tiles
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/tiles
          git commit -q -m "Uppdatera kartdata från OpenStreetMap" || { echo "Inga ändringar"; exit 0; }
          git push origin HEAD:${{ github.ref_name }}
